<!-- templates/library/book_detail.html -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }} - 書籍詳細資訊</title>
</head>
<body>
    <h1>{{ book.title }}</h1>

    <p><strong>價格：</strong>{{ book.price }} 元</p>
    <p><strong>庫存：</strong>{{ book.stock }} 本</p>
    <p><strong>出版社：</strong>{{ book.publisher.name }}</p>

    <hr>

    <a href="{% url 'library:book_list' %}">返回列表</a>
    <a href="{% url 'library:book_edit' book.id %}">編輯</a>
    <a href="{% url 'library:book_delete' book.id %}">刪除</a>
</body>
</html>
