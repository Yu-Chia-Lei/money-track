<!-- apps/moneytrack/templates/moneytrack/edit_expense.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>編輯支出</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>編輯支出</h1>
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-2">
            <label>帳戶：</label>
            <select name="account" id="expense_account" class="form-select">
                {% for acc in accounts %}
                    <option value="{{ acc.id }}" {% if acc == expense.account %}selected{% endif %}>{{ acc.bank_name }}</option>
                {% endfor %}
                <option value="new">新增帳戶...</option>
            </select>
            <input type="text" name="new_account_name" id="new_expense_account_name"
                   class="form-control mt-2"
                   placeholder="輸入新帳戶名稱"
                   style="display:none;">
        </div>
        <div class="mb-2">
            <label>金額：</label>
            <input type="number" step="0.01" name="amount" class="form-control" value="{{ expense.amount }}" required>
        </div>
        <div class="mb-2">
            <label>日期：</label>
            <input type="date" name="date" class="form-control" value="{{ expense.date }}" required>
        </div>
        <div class="mb-2">
            <label>分類：</label>
            <input type="text" name="category" class="form-control" value="{{ expense.category }}">
        </div>
        <div class="mb-2">
            <label>描述：</label>
            <input type="text" name="description" class="form-control" value="{{ expense.description }}">
        </div>
        <div class="mb-2">
            <label>支付方式：</label>
            <select name="payment_method" class="form-select">
                <option value="現金" {% if expense.payment_method == '現金' %}selected{% endif %}>現金</option>
                <option value="信用卡" {% if expense.payment_method == '信用卡' %}selected{% endif %}>信用卡</option>
                <option value="轉帳" {% if expense.payment_method == '轉帳' %}selected{% endif %}>轉帳</option>
            </select>
        </div>
        <button type="submit" class="btn btn-danger">更新支出</button>
        <a href="{% url 'moneytrack:finance_list' %}" class="btn btn-secondary">取消</a>
    </form>

    <script>
        const expenseSelect = document.getElementById('expense_account');
        const newExpenseInput = document.getElementById('new_expense_account_name');
        expenseSelect.addEventListener('change', function() {
            newExpenseInput.style.display = this.value === 'new' ? 'block' : 'none';
        });
    </script>
</body>
</html>
