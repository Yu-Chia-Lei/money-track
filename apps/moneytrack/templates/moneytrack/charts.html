{% extends 'core/base.html' %}

{% block content %}
<style>
    .chart-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    /* 摘要卡片區 */
    .summary-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    @media (max-width: 768px) {
        .summary-row { grid-template-columns: 1fr; }
    }

    .summary-card {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        border-top: 5px solid #ccc;
    }

    .border-income { border-top-color: #1cc88a; }
    .border-expense { border-top-color: #e74a3b; }
    .border-balance { border-top-color: #4e73df; }

    .summary-title {
        font-size: 0.9rem;
        color: #888;
        font-weight: 700;
        text-transform: uppercase;
        margin-bottom: 10px;
    }

    .summary-value {
        font-size: 1.8rem;
        font-weight: 800;
        color: #333;
    }

    /* 按鈕區 */
    .btn-group-custom {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 30px;
    }

    .btn-custom {
        padding: 10px 30px;
        font-size: 1.1rem;
        border: 2px solid #4e73df;
        background: transparent;
        color: #4e73df;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-custom.active, .btn-custom:hover {
        background: #4e73df;
        color: white;
    }

    /* 通用圖表佈局：左右並排 */
    .chart-row-split {
        display: grid;
        grid-template-columns: 1fr 1fr; /* 左右各 50% */
        gap: 25px;
        margin-bottom: 30px;
    }
    
    @media (max-width: 992px) {
        .chart-row-split {
            grid-template-columns: 1fr; /* 手機變直排 */
        }
    }

    .chart-box {
        background: white;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        /* 移除 margin-bottom，改由外層 grid gap 控制 */
        height: 100%; /* 確保同列高度一致 */

        /* [關鍵修正] 加入這兩行 */
        min-width: 0;      /* 告訴 Grid 子元素可以縮小，不要撐開 */
        overflow: hidden;  /* 防止內容溢出 */
    }

    .chart-title {
        font-size: 1.2rem;
        font-weight: bold;
        color: #444;
        margin-bottom: 15px;
        text-align: center;
        border-bottom: 1px solid #eee;
        padding-bottom: 10px;
    }
    
    /* 統一 Canvas 高度 */
    .canvas-container {
        position: relative;
        height: 320px; /* 統一高度，讓並排時比較整齊 */
        width: 100%;
        display: flex;
        justify-content: center; /* 讓圓餅圖置中 */
    }
</style>

<div class="chart-container">
    <!-- <h2 style="text-align: center; margin-bottom: 30px; font-weight: 700; color: #333;">財務報表分析</h2> -->

    <div class="btn-group-custom">
        <button type="button" class="btn-custom active" onclick="loadChartData('month', this)">月報表</button>
        <button type="button" class="btn-custom" onclick="loadChartData('week', this)">週報表</button>
        <button type="button" class="btn-custom" onclick="loadChartData('day', this)">日報表</button>
    </div>

    <div class="summary-row">
        <div class="summary-card border-income">
            <div class="summary-title" style="color: #1cc88a;">總收入 (Income)</div>
            <div class="summary-value" id="summary-income">$0</div>
        </div>
        <div class="summary-card border-expense">
            <div class="summary-title" style="color: #e74a3b;">總支出 (Expense)</div>
            <div class="summary-value" id="summary-expense">$0</div>
        </div>
        <div class="summary-card border-balance">
            <div class="summary-title" style="color: #4e73df;">結餘 (Balance)</div>
            <div class="summary-value" id="summary-balance">$0</div>
        </div>
    </div>

    <div class="chart-row-split">
        <div class="chart-box">
            <div class="chart-title">收支趨勢</div>
            <div class="canvas-container">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
        <div class="chart-box">
            <div class="chart-title">支出分類占比</div>
            <div class="canvas-container">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <div class="chart-row-split">
        <div class="chart-box">
            <div class="chart-title">帳戶資產分布</div>
            <div class="canvas-container">
                <canvas id="accountChart"></canvas>
            </div>
        </div>
        <div class="chart-box">
            <div class="chart-title">支付方式偏好</div>
            <div class="canvas-container">
                <canvas id="paymentChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let trendChart = null;
    let categoryChart = null;
    let accountChart = null;
    let paymentChart = null;

    document.addEventListener('DOMContentLoaded', function() {
        loadChartData('month');
    });

    function loadChartData(mode, btnElement) {
        if (btnElement) {
            document.querySelectorAll('.btn-custom').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        fetch(`{% url 'moneytrack:api_chart_data' %}?mode=${mode}`)
            .then(response => response.json())
            .then(data => {
                updateSummary(data.summary);
                renderTrendChart(data.trend);
                renderCategoryChart(data.category); // 這裡順序沒差，只要有呼叫到
                renderAccountChart(data.account);
                renderPaymentChart(data.payment);
            })
            .catch(error => console.error('Error:', error));
    }

    function updateSummary(summary) {
        const formatter = new Intl.NumberFormat('zh-TW', { style: 'currency', currency: 'TWD', minimumFractionDigits: 0 });
        document.getElementById('summary-income').textContent = formatter.format(summary.income);
        document.getElementById('summary-expense').textContent = formatter.format(summary.expense);
        const balanceEl = document.getElementById('summary-balance');
        balanceEl.textContent = formatter.format(summary.balance);
        balanceEl.style.color = summary.balance < 0 ? '#e74a3b' : '#4e73df';
    }

    // 1. 折線圖 (趨勢)
    function renderTrendChart(data) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (trendChart) trendChart.destroy();

        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.labels,
                datasets: [
                    { label: '收入', data: data.income, borderColor: '#1cc88a', backgroundColor: 'rgba(28, 200, 138, 0.1)', tension: 0.4, fill: true, pointRadius: 2 },
                    { label: '支出', data: data.expense, borderColor: '#e74a3b', backgroundColor: 'rgba(231, 74, 59, 0.1)', tension: 0.4, fill: true, pointRadius: 2 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: { legend: { labels: { usePointStyle: true } } }, // 優化圖例樣式
                scales: { x: { ticks: { maxRotation: 0, autoSkip: true } } } // 防止日期太擠
            }
        });
    }

    // 2. 甜甜圈圖 (分類)
    function renderCategoryChart(data) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (categoryChart) categoryChart.destroy();

        categoryChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: data.labels,
                datasets: [{ 
                    data: data.data, 
                    backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b', '#858796', '#5a5c69'],
                    borderWidth: 2 
                }]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { position: 'right', labels: { boxWidth: 12 } } }, // 圖例放右邊比較省空間
                cutout: '70%' // 讓甜甜圈細一點，看起來比較優雅
            }
        });
    }

    // 3. 水平長條 (帳戶) - 已修正過粗問題
    function renderAccountChart(data) {
        const ctx = document.getElementById('accountChart').getContext('2d');
        if (accountChart) accountChart.destroy();

        accountChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{ 
                    label: '餘額', 
                    data: data.data, 
                    backgroundColor: '#4e73df', 
                    borderRadius: 4,
                    //maxBarThickness: 30 // [關鍵修改] 限制最大粗度為 30px
                }]
            },
            options: { 
                indexAxis: 'y', 
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { legend: { display: false } },
                scales: { 
                    x: { grid: { display: false } }, // 隱藏 X 軸隔線
                    y: { grid: { display: false } }  // 隱藏 Y 軸隔線 (讓畫面更乾淨)
                } 
            }
        });
    }

    // 4. 水平長條 (支付方式) - [已修正] 限制最大粗度，防止單筆資料時過肥
    function renderPaymentChart(data) {
        const ctx = document.getElementById('paymentChart').getContext('2d');
        if (paymentChart) paymentChart.destroy();

        paymentChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [{ 
                    label: '金額', 
                    data: data.data, 
                    backgroundColor: '#f6c23e', 
                    borderRadius: 4,
                    //maxBarThickness: 40, // [關鍵修正] 設定最大寬度為 40px
                    barPercentage: 0.6   // [選用] 控制長條圖佔分類空間的比例
                }]
            },
            options: { 
                indexAxis: 'y', // 水平長條圖
                responsive: true, 
                maintainAspectRatio: false, 
                plugins: { 
                    legend: { display: false } 
                },
                scales: { 
                    x: { 
                        grid: { display: false } // 隱藏 X 軸格線，讓畫面更乾淨
                    },
                    y: { 
                        grid: { display: false } // 隱藏 Y 軸格線
                    }
                } 
            }
        });
    }
</script>
{% endblock %}
