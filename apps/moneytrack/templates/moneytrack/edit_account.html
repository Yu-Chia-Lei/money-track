{% extends "core/base.html" %}
{% load static %}
{% block title %}編輯帳戶{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="{% static 'moneytrack/css/edit_account.css' %}" />

{% endblock %}

{% block content %}
<div class="edit-container">
    <div class="edit-card">
        <h1>編輯帳戶資訊</h1>
        <form method="post" action="">
            {% csrf_token %}
            
            <div class="form-row-custom">
                <label for="id_bank_name">帳戶名稱：</label>
                <input type="text" name="bank_name" id="id_bank_name" class="form-control" value="{{ account.bank_name }}" required>
            </div>

            <div class="form-row-custom">
                <label for="id_balance">起始餘額：</label>
                <input type="number" step="0.01" name="balance" id="id_balance" class="form-control text-success-custom" value="{{ account.balance }}" required>
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <a href="{% url 'moneytrack:account_list' %}" class="btn btn-secondary">返回</a>
                <button type="submit" class="btn btn-success">更新帳戶</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
