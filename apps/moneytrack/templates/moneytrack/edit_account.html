<!-- apps/moneytrack/templates/moneytrack/edit_account.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>編輯帳戶</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>編輯帳戶</h1>
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-2">
            <label>帳戶名稱：</label>
            <input type="text" name="bank_name" value="{{ account.bank_name }}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">更新帳戶</button>
        <a href="{% url 'moneytrack:finance_list' %}" class="btn btn-secondary">取消</a>
    </form>
</body>
</html>
