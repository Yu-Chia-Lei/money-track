<!-- apps/moneytrack/templates/moneytrack/edit_income.html -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>編輯收入</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <h1>編輯收入</h1>
    <form method="post" action="">
        {% csrf_token %}
        <div class="mb-2">
            <label>帳戶：</label>
            <select name="account" id="income_account" class="form-select">
                {% for acc in accounts %}
                    <option value="{{ acc.id }}" {% if acc == income.account %}selected{% endif %}>{{ acc.bank_name }}</option>
                {% endfor %}
                <option value="new">新增帳戶...</option>
            </select>
            <input type="text" name="new_account_name" id="new_income_account_name"
                   class="form-control mt-2"
                   placeholder="輸入新帳戶名稱"
                   style="display:none;">
        </div>
        <div class="mb-2">
            <label>金額：</label>
            <input type="number" step="0.01" name="amount" class="form-control" value="{{ income.amount }}" required>
        </div>
        <div class="mb-2">
            <label>日期：</label>
            <input type="date" name="date" class="form-control" value="{{ income.date }}" required>
        </div>
        <div class="mb-2">
            <label>分類：</label>
            <input type="text" name="category" class="form-control" value="{{ income.category }}">
        </div>
        <div class="mb-2">
            <label>描述：</label>
            <input type="text" name="description" class="form-control" value="{{ income.description }}">
        </div>
        <button type="submit" class="btn btn-success">更新收入</button>
        <a href="{% url 'moneytrack:finance_list' %}" class="btn btn-secondary">取消</a>
    </form>

    <script>
        const incomeSelect = document.getElementById('income_account');
        const newIncomeInput = document.getElementById('new_income_account_name');
        incomeSelect.addEventListener('change', function() {
            newIncomeInput.style.display = this.value === 'new' ? 'block' : 'none';
        });
    </script>
</body>
</html>
