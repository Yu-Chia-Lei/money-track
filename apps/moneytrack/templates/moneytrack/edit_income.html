{% extends "core/base.html" %}
{% load static %}
{% block title %}編輯收入{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'moneytrack/css/edit_income.css' %}" />
{% endblock %}

{% block content %}
<div class="edit-container">
    <div class="edit-card">
        <h1>編輯收入紀錄</h1>
        <form method="post" action="">
            {% csrf_token %}
            
            <div class="form-row-custom">
                <label for="income_account">帳戶：</label>
                <div style="flex: 1;">
                    <select name="account" id="income_account" class="form-select">
                        {% for acc in accounts %}
                            <option value="{{ acc.id }}" {% if acc == income.account %}selected{% endif %}>{{ acc.bank_name }}</option>
                        {% endfor %}
                        <option value="new">新增帳戶...</option>
                    </select>
                    <input type="text" name="new_account_name" id="new_income_account_name"
                           class="form-control mt-2"
                           placeholder="輸入新帳戶名稱"
                           style="display:none;">
                </div>
            </div>

            <div class="form-row-custom">
                <label for="id_amount">金額：</label>
                <input type="number" step="0.01" name="amount" id="id_amount" class="form-control text-success" value="{{ income.amount }}" required>
            </div>
            
            <div class="form-row-custom">
                <label for="id_date">日期：</label>
                <input type="date" name="date" id="id_date" class="form-control" value="{{ income.date|date:'Y-m-d' }}" required>
            </div>
            
            <div class="form-row-custom">
                <label for="id_category">分類：</label>
                <input type="text" name="category" id="id_category" class="form-control" value="{{ income.category }}">
            </div>
            
            <div class="form-row-custom">
                <label for="id_description">描述：</label>
                <input type="text" name="description" id="id_description" class="form-control" value="{{ income.description }}">
            </div>
            
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <a href="{% url 'moneytrack:finance_list' %}" class="btn btn-secondary">取消</a>
                <button type="submit" class="btn btn-success">更新收入</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{% static 'moneytrack/js/edit_income.js' %}"></script>
{% endblock %}
