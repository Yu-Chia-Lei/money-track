<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MoneyTrack{% endblock %}</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  {% load static%}
  <link rel="stylesheet" href="{% static 'core/css/global.css' %}" />

  

  {% block extra_css %}{% endblock %}
</head>

<body>

  <nav>
    <div class="nav-left">
      <a href="{% url 'core:home' %}" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="12" fill="#4CAF50"/>
          <text x="50%" y="50%" dominant-baseline="central" text-anchor="middle" fill="white" font-size="15" font-weight="bold" font-family="Arial, sans-serif">$</text>
        </svg>
        MoneyTrack
      </a>
    </div>

    <div class="nav-links">
      <a href="{% url 'core:home' %}">首頁</a>
      <a href="#">我的帳戶</a>
      <a href="#">收支紀錄</a>
      <a href="#">報表</a>
      <div class="user-icon">👤</div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer>
    <div class="footer-left">
      <a href="#">版權所有</a>
      <a href="#">隱私權政策</a>
      <a href="#">聯絡我們</a>
    </div>
    <div class="footer-right">
      <a href="#">GitHub</a>
    </div>
  </footer>

  
  {% block extra_js %}{% endblock %}

</body>
</html>
