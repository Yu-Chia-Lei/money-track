{% extends 'core/base.html' %}

{% block title %}MoneyTrack 首頁{% endblock %}

{% block extra_head %}
<style>
  /* Hero Section */
  .hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5rem 8rem;
    background-color: white;
    animation: fadeIn 1.5s ease;
  }

  .hero-text {
    max-width: 50%;
    animation: slideInLeft 1.5s ease;
  }

  .hero-text h1 {
    font-size: 2.5rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 2rem;
  }

  .hero-buttons {
    display: flex;
    gap: 1.5rem;
  }

  .btn-primary {
    background-color: #4CAF50;
    color: white;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.3s;
  }

  .btn-primary:hover {
    transform: scale(1.05);
    background-color: #45a049;
  }

  .btn-secondary {
    background-color: #eaeaea;
    padding: 0.8rem 2rem;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, background-color 0.3s;
  }

  .btn-secondary:hover {
    transform: scale(1.05);
    background-color: #d6d6d6;
  }

  .hero img {
    width: 320px;
    animation: slideInRight 1.5s ease;
  }

  /* Features Section */
  .features {
    display: flex;
    justify-content: center;
    gap: 4rem;
    padding: 5rem 8rem;
    background-color: #fafafa;
  }

  .feature-card {
    text-align: center;
    max-width: 220px;
    background-color: white;
    padding: 2rem;
    border-radius: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    transition: transform 0.3s, box-shadow 0.3s;
    animation: fadeUp 1.2s ease;
  }

  .feature-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 8px 18px rgba(0,0,0,0.1);
  }

  .feature-card img {
    width: 60px;
    margin-bottom: 1rem;
  }

  .feature-card h3 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    color: #333;
  }

  .feature-card p {
    font-size: 0.95rem;
    color: #555;
  }
</style>
{% endblock %}

{% block content %}
<section class="hero">
  <div class="hero-text">
    <h1>輕鬆管理每一筆收支，<br>隨時掌握財務狀況</h1>
    <div class="hero-buttons">
      <a href="{% url 'moneytrack:finance_list' %}" class="btn-primary">新增收支</a>
      <a href="{% url 'moneytrack:account_list' %}" class="btn-primary">帳戶管理</a>
    </div>
  </div>
  <img src="https://cdn-icons-png.flaticon.com/512/870/870169.png" alt="App示意圖">
</section>

<section class="features">
  <div class="feature-card">
    <img src="https://cdn-icons-png.flaticon.com/512/2331/2331941.png" alt="帳戶">
    <h3>帳戶管理</h3>
    <p>管理所有帳戶，查看餘額明細</p>
  </div>
  <div class="feature-card">
    <img src="https://cdn-icons-png.flaticon.com/512/2721/2721298.png" alt="收支記錄">
    <h3>收支記錄</h3>
    <p>快速新增收入與支出，清楚掌握財務</p>
  </div>
  <div class="feature-card">
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828884.png" alt="報表">
    <h3>報表與統計</h3>
    <p>用圖表查看收支趨勢與分類</p>
  </div>
</section>
{% endblock %}
