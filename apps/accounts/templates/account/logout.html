{% extends "core/base.html" %}
{% load i18n %}

{% block title %}{% trans "登出" %}{% endblock %}

{% block extra_css %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
/* 自訂樣式，使表單置中且有卡片效果 */
.logout-container {
    padding: 3rem 1rem;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 80vh; 
}
.logout-card {
    background-color: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    width: 100%;
    max-width: 450px;
    text-align: center;
}
.logout-card h1 {
    font-weight: 700;
    font-size: 1.8rem;
    margin-bottom: 25px;
    color: #333;
}
.btn-primary {
    background-color: #dc3545; /* 使用紅色作為登出警示 */
    border-color: #dc3545;
    font-weight: 600;
    transition: transform 0.2s;
}
.btn-primary:hover {
    background-color: #c82333;
    border-color: #c82333;
    transform: scale(1.02);
}
.btn-secondary {
    font-weight: 600;
}
</style>
{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-card">
        <h1>{% trans "您確定要登出嗎?" %}</h1>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-4">
                <a href="javascript:history.back()" class="btn btn-secondary btn-lg">{% trans "取消" %}</a>
                <button class="btn btn-primary btn-lg" type="submit">{% trans "登出" %}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
